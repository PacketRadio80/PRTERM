# PRTERM — Apache HTTP Server (2.4+) config snippet
#
# PRTERM is a standard CGI (RFC 3875). Apache handles this natively with
# mod_cgi / mod_alias — no fcgiwrap, no WSGI, no reverse proxy.
#
# Setup:
#   1. apt install apache2           (Debian/Ubuntu)
#      dnf install httpd             (Fedora / Mageia)
#      pkg install apache24          (FreeBSD)
#      a2enmod cgi alias             (Debian — enable CGI modules)
#
#   2. Install:
#        install -d /usr/lib/cgi-bin/prterm
#        install -m 0755 prterm.cgi    /usr/lib/cgi-bin/prterm/
#        install -m 0640 prterm.ini    /usr/lib/cgi-bin/prterm/      ; group www-data
#
#   3. Drop this file's contents into /etc/apache2/sites-available/prterm.conf
#      (or a <VirtualHost> / <Directory> block in httpd.conf), then:
#        a2ensite prterm && systemctl reload apache2      (Debian)
#        apachectl graceful                                (other)
#
# All paths assume Linux + FHS. The path under /prterm is configurable —
# PRTERM forms links relative to SCRIPT_NAME, so it follows whatever the
# Alias / ScriptAlias gives it.

# --------------------------------------------------------------- mod_cgi ---
# Apache 2.4 on most distros: mod_cgi is already loaded. Uncomment if
# yours isn't.
# LoadModule cgi_module modules/mod_cgi.so

# --------------------------------------------------------------- ScriptAlias
# /prterm/...  -> /usr/lib/cgi-bin/prterm/prterm.cgi
ScriptAlias /prterm /usr/lib/cgi-bin/prterm/prterm.cgi

<Directory "/usr/lib/cgi-bin/prterm">
    Options +ExecCGI +FollowSymLinks
    SetHandler cgi-script

    # Run the CGI as the webserver user (apache2 / www-data / httpd / lighttpd).
    # prterm.cgi identifies itself via CGI-style env (QUERY_STRING, REQUEST_METHOD)
    # and reads prterm.ini from the SAME directory via realpath().
    Require all granted

    # Block direct download of prterm.ini (password hash + device paths).
    <FilesMatch "\.ini$">
        Require all denied
    </FilesMatch>
</Directory>

# Prefix mode (URL is /prterm/anything, maps to a directory of CGIs / files).
# Use this if you want /prterm/ to be a *tree* that includes static assets or
# other CGIs. PRTERM emits its CSS / JS embedded, so you don't need static
# files — but if you want the buster:
#
#   ScriptAlias /prterm/ /usr/lib/cgi-bin/prterm/
#   <Directory "/usr/lib/cgi-bin/prterm">
#       Options +ExecCGI
#       SetHandler cgi-script
#       Require all granted
#       <FilesMatch "\.ini$">
#           Require all denied
#       </FilesMatch>
#   </Directory>

# ----------------------------------------------- Hardening for non-LAN use
# PRTERM is designed for a personal LAN. Whoever exposes it to the internet
# should add HTTPS (e.g. mod_ssl + Let's Encrypt) and access control:
#
#   <Location /prterm>
#       Require local
#       Require ip 192.168.0.0/16
#   </Location>
#
# Reverse proxy with sub-path is also fine, but is more involved — Apache
# + mod_proxy + mod_proxy_http in front of a CGI handler does NOT chain
# cleanly. Stay with the direct ScriptAlias above.
