# PRTERM - lighttpd
#
# PRTERM is a standard CGI (RFC 3875). It needs exactly ONE line of
# configuration, no reverse proxy, no WebSocket, no database.
#
# Setup:
#   1. copy prterm.cgi and prterm.ini to /usr/local/www/cgi-bin/
#   2. copy this section to /usr/local/etc/lighttpd/lighttpd.conf
#   3. restart lighttpd
#
#   Linux   : /etc/lighttpd/lighttpd.conf   service lighttpd restart
#   FreeBSD : /usr/local/etc/lighttpd/lighttpd.conf   service lighttpd restart

server.modules += ( "mod_cgi" )

# run CGI - .cgi is executed, everything else is served as a file
cgi.assign = ( ".cgi" => "" )

# PRTERM is self-contained: CSS and JavaScript are embedded in the binary.
# Nothing else needs to be served.

# Protection: the INI must never be served. It contains the password
# hash and the device paths.
$HTTP["url"] =~ "\.ini$" {
    url.access-deny = ( "" )
}

# Optional: serve under a specific path
# alias.url += ( "/funk/" => "/usr/local/www/cgi-bin/" )

# ---- Hardening for operation outside your own network -------------------
# PRTERM is meant for personal use. Whoever exposes it should put HTTPS
# in front and restrict access:

# $HTTP["remoteip"] !~ "^(192\.168\.|10\.|127\.)" {
#     url.access-deny = ( "" )
# }
