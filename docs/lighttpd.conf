# PRTERM — lighttpd
#
# PRTERM ist ein Standard-CGI (RFC 3875). Es braucht genau EINE Zeile
# Konfiguration, kein Reverse-Proxy, kein WebSocket, keine Datenbank.
#
# Einrichten:
#   1. prterm.cgi und prterm.ini in /usr/local/www/cgi-bin/ kopieren
#   2. diesen Abschnitt nach /usr/local/etc/lighttpd/lighttpd.conf
#   3. lighttpd neu starten
#
#   Linux   : /etc/lighttpd/lighttpd.conf   service lighttpd restart
#   FreeBSD : /usr/local/etc/lighttpd/lighttpd.conf   service lighttpd restart

server.modules += ( "mod_cgi" )

# CGI ausfuehren - .cgi wird gestartet, alles andere ausgeliefert
cgi.assign = ( ".cgi" => "" )

# PRTERM ist selbsttragend: CSS und JavaScript sind ins Binary eingebettet.
# Es muss nichts zusaetzlich ausgeliefert werden.

# Schutz: die INI darf niemals ausgeliefert werden. Sie enthaelt den
# Passwort-Hash und die Geraetepfade.
$HTTP["url"] =~ "\.ini$" {
    url.access-deny = ( "" )
}

# Optional: unter einem bestimmten Pfad bereitstellen
# alias.url += ( "/funk/" => "/usr/local/www/cgi-bin/" )

# ---- Absicherung fuer den Betrieb ausserhalb des eigenen Netzes ----------
# PRTERM ist fuer den Eigenbedarf gedacht. Wer es exponiert, sollte
# mindestens HTTPS vorsetzen und den Zugriff beschraenken:

# $HTTP["remoteip"] !~ "^(192\.168\.|10\.|127\.)" {
#     url.access-deny = ( "" )
# }
