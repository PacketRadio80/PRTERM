# PRTERM — Busybox HTTPD config snippet
#
# Busybox httpd is a tiny single-purpose HTTP server (around 20 KB compiled).
# When busybox is built with CONFIG_HTTPD_CGI=y, it serves *.cgi from the
# document root directly, with no extra service. It's the smallest deployment
# that gets you a working PRTERM — useful for development, troubleshooting,
# or hardware with no room for a full server stack (single-board computers,
# rescue boxes, low-RAM containers, etc.).
#
# NOT recommended for production or LAN sharing: it has no access control,
# no HTTPS, and no log. Use lighttpd / Apache / NGinx for anything that
# matters.
#
# Setup:
#   1. Build / install busybox with CONFIG_HTTPD=y and CONFIG_HTTPD_CGI=y.
#      On most distros this is the default busybox package; check:
#        busybox httpd 2>&1 | head -1   # shows usage when present
#        grep HTTPD_CGI /path/to/busybox/.config
#
#   2. Place PRTERM in the document root:
#        install -d  /var/www/prterm
#        install -m 0755 prterm.cgi  /var/www/prterm/
#        install -m 0644 prterm.ini  /var/www/prterm/
#
#   3. Start it. There is NO config file format — busybox httpd is a
#      command-line tool. Flags below are the only knobs:
#
#        busybox httpd \
#            -p 8080 \
#            -h /var/www/prterm \
#            -u nobody \
#            -c /var/www/prterm/httpd.conf
#
#   The -c file is OPTIONAL: busybox reads PATH_INFO, default index, and
#   auth settings from it. PRTERM does not need any of those, so the -c
#   is usually skipped. See "Optional config" below for the bits PRTERM
#   cares about.

# --------------------------------------------------------------- flags -----
#
# -p <port>               TCP port to listen on. Default: 80.
#                         Pick something off the standard ports if multiple
#                         services live on the same host, e.g. 8080.
#                         Plain httpd binds <=1024 only with root privs —
#                         PRTERM does NOT need root, so use a high port >
#                         1024 and drop privs with -u.
#
# -h <home>               Document root (where *.cgi live).
#
# -u <user>[:group]       Drop to user / group after binding the socket.
#                         PRTERM doesn't talk to devices from the CGI path —
#                         only prterm-tncd does — but the CGI must have
#                         *read* access to prterm.ini in the doc root, so
#                         www-data / nobody won't work; the user needs
#                         group = the one that owns the INI. PRTERM's
#                         dist run user is 'lighttpd' (Fedora / Mageia) or
#                         'www-data' (Debian).
#
# -c <config>             Optional config file (see below).
#
# -r                      Chroot into -h before serving. Useful when -h is
#                         a sanitised directory and you want to limit the
#                         attack surface further.
#
# -v                      Verbose (debug logs to stderr). Don't leave this
#                         on in steady state.

# -------------------------------------------------- Optional config (-c) --
#
# Keywords accepted by busybox httpd, focused on the bits PRTERM needs.
# Save as e.g. /var/www/prterm/httpd.conf and pass via -c.
#
#   I:index.html             # default index when only "/prterm.cgi" is asked.
#                            PRTERM does NOT use directory indexes; clients
#                            that fetch "/" will get 404. Either pass the
#                            exact path /prterm.cgi or set up a redirector.
#                            A typical trick is to put a 0-byte HTML file
#                            with <meta http-equiv=refresh> as index.html.
#
#   H:*                     # Hide dotfiles. Already default.
#
#   E404:...                # Custom 404 handler. PRTERM's CGI sees
#                            /unknown and answers; if the webserver
#                            doesn't reach the CGI on plain directory
#                            requests, the user may need an explicit
#                            /index.html that links to /prterm.cgi.

# --------------------------------------------------------- Security note --
# - *.ini in the doc root WILL be served on direct request. Keep the INI
#   out of -h, or rename it to something the URL flow won't guess, or rely
#   on operating-system file permissions (root-owned INI + httpd running
#   as unprivileged user = NoPermissions on read). PRTERM's installer
#   sets the INI to 0640 root:lighttpd, which makes busybox-httpd running
#   as 'lighttpd' read it just fine while blocking 'nobody' / 'apache'.
#
# - busybox httpd has no built-in access control list, no HTTPS, no user
#   auth beyond a single global realm. It is a developer tool, not a
#   server. Move to lighttpd / Apache / NGinx before opening the port
#   beyond localhost.

# ------------------------------------------------------------ Live example --
#
# Drop this into /etc/local.d/prterm.start (Gentoo / Alpine style):
#
#   #!/bin/sh
#   busybox httpd -p 8080 -h /var/www/prterm -u lighttpd &
#
# Or, system-wide via systemd (works everywhere with systemd ≥ 230):
#
#   [Unit]
#   Description=PRTERM (busybox httpd, dev only)
#   After=network.target
#
#   [Service]
#   Type=simple
#   ExecStart=/bin/busybox httpd -p 8080 -h /var/www/prterm -u lighttpd -f
#   Restart=on-failure
#   User=lighttpd
#
#   [Install]
#   WantedBy=multi-user.target
