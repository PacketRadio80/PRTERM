# PRTERM braucht Zugriff auf die seriellen Geraete der TNCs.
#
# Ursprung des Problems: PrivateDevices=yes legt dem Dienst ein eigenes
# /dev vor. Damit waren /dev/ttyUSB* und /dev/serial fuer lighttpd
# unsichtbar - es sah aus wie "Geraet nicht gefunden", war aber die
# Sandbox des Dienstes.
#
# DeviceAllow=char-tty greift hier NICHT: USB-Serial ist Major 188
# (usbserial), nicht die tty-Klasse. Deshalb wird nur PrivateDevices
# abgeschaltet; der Zugriff selbst bleibt ueber die Dateirechte
# begrenzt (root:dialout, 0660) und www-data ist in dialout.
[Service]
PrivateDevices=no
