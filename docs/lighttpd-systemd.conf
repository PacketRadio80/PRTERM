# PRTERM needs access to the serial devices of the TNCs.
#
# Origin of the problem: PrivateDevices=yes gives the service its own
# /dev. That made /dev/ttyUSB* and /dev/serial invisible to lighttpd -
# it looked like "device not found", but it was the service sandbox.
#
# DeviceAllow=char-tty does NOT help here: USB-serial is major 188
# (usbserial), not the tty class. Therefore only PrivateDevices is
# switched off; access itself stays limited via file permissions
# (root:dialout, 0660) and www-data is in dialout.
[Service]
PrivateDevices=no
