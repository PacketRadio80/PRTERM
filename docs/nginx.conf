# PRTERM — NGinx + fcgiwrap config snippet
#
# NGinx has no native CGI. The standard bridge is fcgiwrap: a tiny FastCGI
# process that exec()s a local binary per request. That's exactly what
# PRTERM needs — RFC 3875 CGI env vars (QUERY_STRING, REQUEST_METHOD,
# REMOTE_ADDR, ...) come from fastcgi_params.
#
# Setup:
#   1. Install fcgiwrap:
#        apt install fcgiwrap                       (Debian/Ubuntu)
#        dnf install fcgiwrap                       (Fedora ≥ 35, EPEL)
#        pkg install fcgiwrap                       (FreeBSD)
#
#      Service activation:
#        systemctl enable --now fcgiwrap.socket     (Debian/Ubuntu)
#      Manual mode (other systems):
#        fcgiwrap -s unix:/run/fcgiwrap.sock &
#
#   2. Install:
#        install -d /usr/lib/cgi-bin/prterm
#        install -m 0755 prterm.cgi    /usr/lib/cgi-bin/prterm/
#        install -m 0644 prterm.ini    /usr/lib/cgi-bin/prterm/
#
#   3. Drop the location block below into your server { ... } section, then:
#        nginx -t && systemctl reload nginx
#
#   4. Open the firewall: NGinx listens on 80 (or 443 if TLS), localhost only
#      unless you explicitly bind 0.0.0.0.

# --------------------------------------------------------------- main site
server {
    listen       80 default_server;
    server_name  _;
    root         /var/www/html;
    index        index.html;

    # access_log / error_log path; combined log is fine.
    access_log   /var/log/nginx/prterm.access.log  combined;
    error_log    /var/log/nginx/prterm.error.log   warn;

    # ------------------------------------- fcgiwrap bridge for /prterm.cgi --
    location = /prterm.cgi {
        include                 fastcgi_params;
        fastcgi_pass            unix:/run/fcgiwrap.sock;

        # SCRIPT_FILENAME is what fcgiwrap exec()s. The rest of *fastcgi_params*
        # supplies QUERY_STRING, REQUEST_METHOD, REMOTE_ADDR, CONTENT_TYPE,
        # CONTENT_LENGTH, HTTP_COOKIE, HTTP_* headers etc. — enough to satisfy
        # RFC 3875 for PRTERM.
        fastcgi_param  SCRIPT_FILENAME  /usr/lib/cgi-bin/prterm/prterm.cgi;

        # PRTERM emits a clean HTTP/1.1 response with Content-Length and
        # Content-Type. Two file-descriptor-based helpers NGinx sets — out of
        # a CGI context they don't exist.
        fastcgi_param  REMOTE_PORT      $remote_port;
        fastcgi_param  SERVER_ADDR      $server_addr;
        fastcgi_param  SERVER_PORT      $server_port;
    }

    # ---------------------------------------------------- /prterm/assets ---
    # PRTERM embeds CSS / JS in the binary, so static assets aren't needed.
    # If you'd rather host them separately, drop a tiny reverse proxy here:
    #
    #   location /prterm/assets/ { alias /usr/share/prterm/assets/; }
    #
    # Or, more conservative, point this to a deny handler — see below.

    # --------------------------------------------- never serve the INI ---
    # prterm.ini contains the password hash and the device paths. Block any
    # direct read regardless of URL.
    location ~ ^/prterm.*\.ini$ {
        deny all;
        return 403;
    }

    # --------------------------------------- everything else is static ----
    location / {
        try_files $uri $uri/ =404;
    }
}

# ------------------------------------------------- HTTPS front (optional) --
# For LAN-only PRTERM, plain HTTP is fine. If you do expose this, terminate
# TLS at NGinx and add basic auth or IP-based access:
#
#   auth_basic           "PRTERM";
#   auth_basic_user_file /etc/nginx/.htpasswd-prterm;
#
# PRTERM's [admin] login runs on top of that. The two layers are independent
# — outer is for transport / exposure, inner is for application admin actions.
