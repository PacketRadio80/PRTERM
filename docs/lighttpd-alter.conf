# PRTERM Alter — lighttpd config snippet
# Add to /etc/lighttpd/conf-enabled/ alongside 10-prterm.conf
# Provides the alternative retro CGI at /prterm-alter.cgi

# Same CGI setup as prterm.cgi
$HTTP["url"] =~ "^/prterm-alter\.cgi" {
    cgi.assign += ( ".cgi" => "" )
}

# Protect .ini files from being served through the alter CGI
$HTTP["url"] =~ "\.ini$" {
    url.access-deny = ( "" )
}