; ===========================================================================
;  PRTERM - CB & Amateurfunk Terminal
;  prterm.ini - die einzige Konfigurationsdatei
;
;  Liegt im SELBEN Ordner wie prterm.cgi. Keine Installation noetig:
;  prterm.cgi + prterm.ini reinkopieren, fertig.
;
;  Zeilen beginnend mit ';' oder '#' sind Kommentare.
;  Format:  [section]   /   schluessel = wert
; ===========================================================================

[site]
name          = PRTERM
subtitle      = CB & Amateurfunk Terminal
language      = de

; ---------------------------------------------------------------------------
[station]
; CALLERID = Basisrufzeichen (max. 6 Zeichen) + optionale SSID "-<Ziffer>".
; Wie im Funk ueblich: maximal 8 Zeichen insgesamt, also 6 + 2 ("-" + Ziffer).
; Beispiel:  DL1ABC-1      (7 Zeichen)
;             PRTERM-7      (7 Zeichen)
;             DL1ABC        (6 Zeichen, ohne SSID)
; Validierung siehe [callsign].
callerid      = PRTERM-1
qth           =
locator       =

; ---------------------------------------------------------------------------
[ui]
; Schriftdatei (.otf oder .ttf), relativ zur prterm.ini oder absolut.
; Leer lassen = System-Monospace.
; Die Datei wird vom CGI unter  /prterm.cgi/font  ausgeliefert.
font_file     = ./fonts/prterm.ttf

; Schriftgroesse in CSS-Pixel.
font_size     = 14

; Zeilenabstand als Vielfaches der Schriftgroesse.
line_height   = 1.2

; Dichte des Terminals:
;   compact = maximaler Zeichenraum, Rand und Chrome auf ein Minimum
;   normal  = Standard mit Luft
density       = compact

; Zeichenraster. 0 heisst: aus Schriftgroesse und Fenstergroesse ableiten
; und so viele Zeichen zeigen, wie Schriftgroesse und Bildschirmaufloesung
; hergeben.
rows          = 0
columns       = 0

; Theme: silver | dark
;   silver = hell-silbriger Hintergrund, Schrift dunkelblau -> schwarz
;            (Standard, siehe docs/UI-THEME.md)
;   dark   = dunkle Variante fuer Dunkelbetrieb
theme         = silver

; ---------------------------------------------------------------------------
[radio]
; Vollduplex (full) = RX und TX laufen gleichzeitig. Das ist der Punkt, der
;                    mit klassischem CB-Funk nicht geht: waehrend des Sendens
;                    wird weiter empfangen und protokolliert.
; Halbduplex   (half) = RX wird waehrend TX geschaltet/gedrosselt.
duplex        = full

; Rig-Treiber. Verfuegbar:
;   sim     - Simulation, kein Hardware (fuer Entwicklung)
;   tmodem  - T-Modem als half-TNC (Ueberloesung bis zum Eigenbau-TNC)
;   max25   - TNCs die mit MAX25-Stack arbeiten
driver        = tnc2

; Serielle Schnittstelle zum TNC (USB-SERIAL-Converter / COM-Port).
;   Linux   : /dev/ttyUSB0   /dev/ttyACM0   /dev/ttyS0
;   FreeBSD : /dev/cuaU0     /dev/ttyU0
;
; TIPP: die stabile Kennung verwenden, nicht /dev/ttyUSB0. Bei mehreren
; Adaptern tauscht die Nummerierung, und der Pfad bleibt auf allen
; Maschinen derselbe.
port          = /dev/serial/by-id/usb-FTDI_USB_Serial_Converter_FTC7OKUL-if00-port0

; Baudrate der seriellen Verbindung zum TNC (nicht die Funk-Baudrate!).
; Landolt TNC2C: 19200
baud          = 19200

; Funk-Baudrate - die Datenrate AUF DEM KANAL, nicht zur Schnittstelle.
; Bestimmt das Modem im TNC und darf nicht mit der seriellen Rate
; verwechselt werden.
;   TNC2C   : 2400 Baud (Modem TCM3105)
;   PK-TNC2 : 1200 Baud
radio_baud    = 2400

; Modem-Typ im TNC, soweit bekannt.
modem         = tcm3105

; Zeilenformat: 8n1 | 7e1 | 7o1 | 8e1 | 8o1
; Landolt TNC2C: 8n1 - auch wenn das Handbuch 7E1 nennt. Der Banner kommt
; fehlerfrei als reines ASCII; bei 7E1 waere das Paritaetsbit sichtbar.
line          = 8n1

; Empfangs-/Sendefrequenz in Hz (Anzeige + Steuerung).
freq_hz       = 27235000

; Betriebsart:  lsb  usb  am  fm  cw
mode          = am

; Wie oft der Zustand abgefragt wird (Millisekunden).
rx_poll_ms    = 250

; Maximale Anzahl Logzeilen die vorgehalten werden.
max_log       = 500

; ---------------------------------------------------------------------------
[admin]
; Admin-Bereich ein-/ausschalten.
enabled       = true

; Benutzername fuer den Admin-Bereich.
user          = admin

; Passwort-Hash im Format:  sha256$<salt>$<hash>
; Erzeugen mit:   ./prterm.cgi --hash-password "meinPasswort"
; Solange der Eintrag leer ist, ist KEIN Login moeglich (sicherer Default).
pass_hash     =

; Gueltigkeit einer Session in Minuten.
session_ttl_min = 480

; Duerfen nicht eingeloggte Benutzer senden?
allow_guest_tx  = true

; ---------------------------------------------------------------------------
[callsign]
; Regeln fuer CALLID / CALLERID. Werden bei der Validierung verwendet.

; CALLID: reines Rufzeichen/Basis, ohne SSID, maximal so viele Zeichen.
callid_max_len       = 6

; CALLERID: Basislaenge ...
callerid_base_len    = 6

; ... und Gesamtlaenge inklusive SSID ("-<Ziffer>") = 6 + 2 = 8.
callerid_max_total   = 8

; SSID "-<Ziffer>" zulassen (wie im Funk ueblich).
callerid_allow_ssid  = true

; Wieviele Ziffern nach dem '-' (1 -> -0 .. -9).
callerid_ssid_digits = 1

; ---------------------------------------------------------------------------
[ban]
; Gebannte CALLID / CALLERID. Schluessel = Muster, Wert = Grund.
; Platzhalter:  '*'  = beliebige Zeichenkette
;               '?'  = genau ein Zeichen
;
; Beispiele:
;   DL9*        = Spam
;   KB1ABC-3    = Stoerbetrieb
;   *SPAM*      = Werbung

; ---------------------------------------------------------------------------
[paths]
; Verzeichnis fuer Sessions, Rig-Zustand und Log. Relativ zum CGI oder absolut.
runtime_dir   = ./prterm.runtime
