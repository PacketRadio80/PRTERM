; ===========================================================================
;  PRTERM - CB & amateur radio terminal
;  prterm.ini - the only configuration file
;
;  Lives in the SAME folder as prterm.cgi. No installation needed:
;  just copy prterm.cgi + prterm.ini over, done.
;
;  Lines starting with ';' or '#' are comments.
;  Format:  [section]   /   key = value
; ===========================================================================

[site]
name          = PRTERM
subtitle      = CB & Amateur Radio Terminal
; Language of the interface. PRTERM speaks the big five:
;   en = English     (source language, always the fallback)
;   de = Deutsch
;   es = Español
;   pt = Português
;   fr = Français
; Everything the operator reads on screen is translated; the CLI and
; the log files stay English. Unknown codes fall back to English.
language      = en

; ---------------------------------------------------------------------------
[station]
; CALLERID = base call sign (max. 6 characters) + optional SSID "-<digit>".
; As usual in radio: 8 characters in total at most, i.e. 6 + 2 ("-" + digit).
; Examples:   DL1ABC-1      (7 characters)
;             PRTERM-7      (7 characters)
;             DL1ABC        (6 characters, without SSID)
; Validation see [callsign].
callerid      = PRTERM-1
qth           =
locator       =

; ---------------------------------------------------------------------------
[ui]
; Font file (.otf or .ttf), relative to prterm.ini or absolute.
; Leave empty = system monospace.
; The file is served by the CGI under  /prterm.cgi/font .
font_file     = ./fonts/prterm.ttf

; Font size in CSS pixels.
font_size     = 14

; Line height as a multiple of the font size.
line_height   = 1.2

; Density of the terminal:
;   compact = maximum character space, margin and chrome to a minimum
;   normal  = standard with breathing room
density       = compact

; Character grid. 0 means: derive from font size and window size
; and show as many characters as font size and screen resolution
; provide.
rows          = 0
columns       = 0

; Theme: silver | dark
;   silver = light silvery background, dark blue lettering fading -> black
;            (default, see docs/UI-THEME.md)
;   dark   = dark variant for dark-room operation
theme         = silver

; ---------------------------------------------------------------------------
; RADIO — global defaults only.
;
; Device-specific settings (driver, port, baud, modem, line, kiss_init,
; freq_hz, mode) belong in [station:NAME] sections below. These global
; keys are kept as fallback for backward compatibility but are not the
; intended way to configure devices.
;
; Keys that are truly global:
;   duplex       — half/full duplex (shared across all stations)
;   tx_power_mw  — compliance power limit (shared)
;   rx_poll_ms   — polling interval
;   max_log      — message log buffer size
; ---------------------------------------------------------------------------
[radio]
duplex        = full
tx_power_mw   = 4000
rx_poll_ms    = 250
max_log       = 500

; ---------------------------------------------------------------------------
[admin]
; Switch the admin area on/off.
enabled       = true

; User name for the admin area.
user          = admin

; Password hash in the format:  sha256$<salt>$<hash>
; Create with:   ./prterm.cgi --hash-password "myPassword"
; As long as the entry is EMPTY, the built-in password is active and the
; administration shows a warning - that state is only meant for the first
; installation. Set your own hash as soon as the installation is yours.
pass_hash     =

; Validity of a session in minutes.
session_ttl_min = 480

; May users that are not logged in transmit?
allow_guest_tx  = true

; ---------------------------------------------------------------------------
[mailboxd]
; MailboxD is a separate daemon that PRTERM can drive locally - the mailbox and
; BBS side of the station. Everything radio stays here in PRTERM.
;
;   1 = show the "Mailbox" tab and everything behind it
;   0 = hide it completely (default)
;
; At 0 the tab is not rendered at all. There is no greyed-out button and no
; hint that the feature exists - if MailboxD is not installed there is nothing
; to explain.
enabled       = 0

; Where MailboxD is installed. MailboxD lives entirely in its own directory and
; only exposes service and start scripts to the system.
;
; Fixed layout. This is the preferred location; when it does not exist, PRTERM
; falls back through the list in order:
;
;     /var/mailboxd          primary
;     /usr/mailboxd          fallback
;     /usr/local/mailboxd    fallback
dir           = /var/mailboxd

; ---------------------------------------------------------------------------
[debug]
; Trace level for prterm-tncd and the CGI driver:
;
;   off | error | warn | info | debug | trace
;
; warn (default) keeps the journal readable. debug shows the KISS
; sequence, MYCALL replies and every TX. trace additionally hexdumps
; every byte on the serial line - the wire protocol itself:
;
;   daemon : journalctl -u prterm-tncd
;   CGI    : the webserver's error log
level         = warn

; ---------------------------------------------------------------------------
[callsign]
; Rules for CALLID / CALLERID. Used during validation.

; CALLID: plain call sign/base, without SSID, at most this many characters.
callid_max_len       = 6

; CALLERID: base length ...
callerid_base_len    = 6

; ... and total length including SSID ("-<digit>") = 6 + 2 = 8.
callerid_max_total   = 8

; Allow SSID "-<digit>" (as usual in radio).
callerid_allow_ssid  = true

; How many digits after the '-' (1 -> -0 .. -9).
callerid_ssid_digits = 1

; ---------------------------------------------------------------------------
[ban]
; Banned CALLID / CALLERID. Key = pattern, value = reason.
; Placeholders:  '*'  = any string
;               '?'  = exactly one character
;
; Examples:
;   DL9*        = spam
;   KB1ABC-3    = interference
;   *SPAM*      = advertising

; ---------------------------------------------------------------------------
[paths]
; Directory for sessions, rig state and log. Relative to the CGI or absolute.
runtime_dir   = ./prterm.runtime

; ---------------------------------------------------------------------------
; STATIONS
;
; Each [station:NAME] is a complete station: own TNC, own radio,
; own antenna. All device-specific settings live here.
;
; kiss_init = how this TNC enters KISS mode:
;   esc    ESC @K, without line end   - Landolt TNC2C (TheFirmware)
;   auto   ESC @K, repeated when the firmware only answers "kiss on"
;          - PK-TNC2 (TheFirmware TNC-2 class)
;   tapr   "kiss on\r"                - real TAPR class only
;   native device is already in KISS  - BayCom/PTY (prterm-baycom)
; prterm-tncd enters KISS ONCE and holds it - sending happens with
; KISS DATA frames, there is no switching per message.
;
; mode = per-device FM/AM/SSB switch. Leave empty or omit to inherit
; the global [radio] mode. The compliance gate checks this per station.
;
; freq_hz = per-device frequency (Hz). Leave empty or 0 to inherit
; the global [radio] freq_hz. Use for cross-band/repeater/experimental.
;
; radio_baud = on-air data rate (HARDWARE, not changeable).
; ---------------------------------------------------------------------------
[station:tnc2c]
driver      = tnc2
port        = /dev/serial/by-id/usb-FTDI_USB_Serial_Converter_FTC7OKUL-if00-port0
baud        = 19200
radio_baud  = 2400
modem       = tcm3105
line        = 8n1
kiss_init   = esc
mode        = fm
freq_hz     = 27235000
callerid    = PRTERM-1
antenne     = Vertikal
enabled     = true

[station:pktn2c]
driver      = tnc2
port        = /dev/serial/by-id/usb-Prolific_Technology_Inc._USB-Serial_Controller-if00-port0
baud        = 9600
radio_baud  = 1200
line        = 8n1
kiss_init   = auto
mode        = fm
freq_hz     = 27245000
callerid    = PRTERM-2
antenne     = Richtantenne
enabled     = true

; T-Modem-s1224 (USB KISS half-TNC auf Pico) — NOETIGER Ersatz des
; PC-COM, gleicher Kanal 52 (26.675 MHz). Firmware spricht ab Werk
; KISS: kiss_init = native (kein Probe, kein MYCALL, kein KISS-Eintritt).
; WICHTIG: RX-Frames kommen OHNE FCS — Firmware validiert und strippt
; den Trailer selbst (siehe src/tmodem.c).
; port: FreeBSD /dev/cuaU0, Linux /dev/ttyACM0.
[station:tms12240]
driver      = tmodem
port        = /dev/cuaU0
baud        = 115200
radio_baud  = 2400
modem       = softmodem
line        = 8n1
kiss_init   = native
mode        = fm
freq_hz     = 26675000
callerid    = PRTERM-3
antenne     = Stabo XM 3082
enabled     = true

; NOTFALL: PC-COM / Compa SER12 auf Kanal 52 — nur wenn das T-Modem
; (oben, tms12240) ausfaellt. Davor port/driver oben auf tnc2 + kiss-bc0
; zurueckstellen und diesen Block aktivieren (enabled=true). Die
; KISS-PTY kommt von prterm-baycom (root, ioperm), kiss_init=native.
;[station:pccom-fallback]
;driver      = tnc2
;port        = ./prterm.runtime/kiss-bc0
;baud        = 9600
;radio_baud  = 1200
;modem       = tcm3105
;line        = 8n1
;kiss_init   = native
;mode        = fm
;freq_hz     = 26675000
;callerid    = PRTERM-3
;antenne     = PC-COM DiPol
;enabled     = false
