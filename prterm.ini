; PRTERM - CB & Amateur Radio Terminal
; Minimal common configuration (prterm.ini)
; See prterm.ini.full for every option and documentation.

[site]
name            = PRTERM
language        = en

[station]
callerid        = PRTERM-1
qth             = MGH
locator         = JN49VL

[ui]
font_size       = 14
line_height     = 1.2
density         = compact
theme           = silver

[radio]
duplex          = half
driver          = tnc2
port            = /dev/ttyUSB0
baud            = 115200
radio_baud      = 1200
line            = 8n1
kiss_init       = esc
mode            = am
rx_poll_ms      = 250

[admin]
enabled         = true
user            = admin
session_ttl_min = 480
allow_guest_tx  = true

[mailboxd]
enabled         = false
dir             = /var/mailboxd

[debug]
level           = warn

[paths]
runtime_dir     = ./prterm.runtime

[station:tnc2c]
driver          = tnc2
port            = /dev/ttyUSB0
baud            = 19200
radio_baud      = 2400
modem           = tcm3105
line            = 8n1
kiss_init       = esc
mode            = fm
enabled         = true

[station:pktn2c]
driver          = tnc2
port            = /dev/ttyUSB1
baud            = 9600
radio_baud      = 1200
kiss_init       = auto
mode            = fm
enabled         = true