# PRTERM via lighttpd - Host A515 (Mageia 10)
# Installed as: /etc/lighttpd/conf-enabled/10-prterm.conf
#
# PRTERM is a standard CGI (RFC 3875): mod_cgi + one assignment is all
# it needs. The docroot is /var/www/html, so /prterm/prterm.cgi maps
# directly onto /var/www/html/prterm/prterm.cgi - no alias required.

server.modules += ( "mod_cgi" )

# .cgi is executed, everything else is served as a file
cgi.assign = ( ".cgi" => "" )

# Protection: the INI must never be served. It contains the password
# hash and the device paths.
$HTTP["url"] =~ "\.ini$" {
    url.access-deny = ( "" )
}

# Protection: the runtime dir must never be served (state, log,
# sessions, sockets).
$HTTP["url"] =~ "^/prterm/prterm\.runtime" {
    url.access-deny = ( "" )
}
